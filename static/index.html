<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volkswagen Bangalore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .outlets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .outlet-card { background: #171a21; padding: 20px; border-radius: 8px; }
    .outlet-card h3 { margin-bottom: 10px; color: #fff; }
    .outlet-card p { color: #a1a1aa; margin: 5px 0; font-size: 14px; }
  </style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1>Volkswagen Bangalore</h1>
  </div>
</header>

<main class="wrap" style="padding-top: 40px; padding-bottom: 80px;">
  
  <section id="models-section" style="margin-bottom: 60px;">
    <h2>Our Line-up</h2>
    <p>Explore the Volkswagen range available at our Bangalore showrooms.</p>
    <div class="grid-cards" id="models-grid" style="margin-top:20px;"></div>
  </section>

  <section id="outlets-section" style="margin-bottom: 60px;">
    <h2>Our Outlets in Bangalore</h2>
    <div class="outlets-grid" id="outlets-grid"></div>
  </section>

  <section id="contact-section">
    <h2>Contact Us</h2>
    <form id="contact-form" style="max-width: 400px; margin-top: 20px;">
      <div class="field">
        <label>Name</label>
        <input type="text" id="contact-name" required>
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="text" id="contact-phone" required>
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="contact-message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <p id="contact-result" style="margin-top: 10px; color: #10b981;"></p>
    </form>
  </section>

</main>

<script>
  (function () {
    var w = window;
    w.Perfox = w.Perfox || function () {
      (w.Perfox.q = w.Perfox.q || []).push(arguments);
    };
  })();
</script>
<script src="https://skill-mine-api.perfox.ai/widget/v1/widget.js"
        data-site="sa_site_live_1Y359MWPZR04A7VVD44KYZ24TN7BPWZT"
        defer></script>
        
<script>
  async function loadData() {
    // Load Models
    const modelsRes = await fetch('/api/models');
    const modelsData = await modelsRes.json();
    const modelsGrid = document.getElementById('models-grid');
    modelsGrid.innerHTML = modelsData.models.map(m => `
      <div class="card">
        <img src="${m.image}" alt="${m.name}" style="width:100%; border-radius:8px; margin-bottom:15px;">
        <h3>${m.name}</h3>
      </div>
    `).join('');

    // Load Outlets
    const outletsRes = await fetch('/api/outlets');
    const outletsData = await outletsRes.json();
    const outletsGrid = document.getElementById('outlets-grid');
    outletsGrid.innerHTML = outletsData.outlets.map(o => `
      <div class="outlet-card">
        <h3>${o.name}</h3>
        <p><strong>Type:</strong> ${o.type}</p>
        <p><strong>Address:</strong> ${o.address}</p>
        <p><strong>Phone:</strong> ${o.phone}</p>
        <p><strong>Email:</strong> ${o.email}</p>
      </div>
    `).join('');
  }

  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('contact-name').value,
        phone: document.getElementById('contact-phone').value,
        message: document.getElementById('contact-message').value
      })
    });
    const data = await res.json();
    document.getElementById('contact-result').innerText = data.message;
  });

  loadData();
</script>
</body>
</html>
